repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --new-from-rev=HEAD~1 --fix
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test -short -timeout=5m ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: nix-build-checks
        name: nix build checks
        entry: nix build -L .#checks.x86_64-linux.package
        language: system
        files: ^(flake\.nix|flake\.lock|go\.mod|go\.sum)$
        pass_filenames: false
